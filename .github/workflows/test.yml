name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Set up pnpm
        uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          version: 12.15.0
          run_install: false
      - name: Install locked MCP dependencies
        id: dependencies
        run: pnpm --dir experimental/agent-mcp install --frozen-lockfile --ignore-scripts
      # The full suite includes MCP tests; browser and external-agent tests skip
      # without their optional tooling. The next step reports MCP separately.
      - name: Run full repository suite
        env:
          TMPDIR: ${{ runner.temp }}
        run: pnpm test
      - name: Run agent MCP tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        env:
          TMPDIR: ${{ runner.temp }}
        run: node --test experimental/agent-mcp/test/*.test.js

  browser:
    name: Synthetic browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Set up pnpm
        uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          version: 12.15.0
          run_install: false
      - name: Install browser test tooling
        run: |
          mkdir -p "$RUNNER_TEMP/weftline-browser"
          pnpm --dir "$RUNNER_TEMP/weftline-browser" add --ignore-scripts --lockfile=false playwright-core@1.65.1
      - name: Test with sandboxed Chrome and synthetic provider
        env:
          TMPDIR: ${{ runner.temp }}
          PLAYWRIGHT_CORE: ${{ runner.temp }}/weftline-browser/node_modules/playwright-core/index.mjs
        run: |
          export CHROMIUM_PATH="$(command -v google-chrome)"
          test -n "$CHROMIUM_PATH"
          node --test test/review-candidate-display-browser.test.js
